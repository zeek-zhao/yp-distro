# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-zeek"
BBFILE_PATTERN_meta-zeek = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-zeek = "20"

LAYERDEPENDS_meta-zeek = "core"
LAYERSERIES_COMPAT_meta-zeek = "kirkstone scarthgap"
