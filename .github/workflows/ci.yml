name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - name: Install tools and lint
        run: |
          set -euo pipefail
          bash scripts/ci/install-tools.sh --prefix "$RUNNER_TEMP/tools"
          export PATH="$RUNNER_TEMP/tools/bin:$PATH"
          bash scripts/ci/lint.sh
  bats:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # 磁盘水位门禁是为共享构建机设计的（work/ 大卷基线 69%）；GitHub runner
    # 的根盘基线就有 ~70%，job 内拉镜像后间歇性越过 85% 默认阈值，把所有走
    # check_disk_watermark 的用例（doctor/dry-run/preflight，共 15 个）打红。
    # 一次性 runner 上这个检查没有保护对象，放宽到 95%。
    env:
      WATERMARK_PCT: "95"
    steps:
      - uses: actions/checkout@v4
        with:
          # 04_layer 的 DISTRO_VERSION↔git tag 动态断言（#130）走 git describe：
          # 浅克隆下 HEAD 没有祖先链，fetch-tags 只送来 tag 对象，describe 摸不到
          # 最近 tag，断言拿到空串必挂——这个 job 需要全历史（同 identity-guard）
          fetch-tags: true
          fetch-depth: 0
      - name: Install tools
        run: |
          set -euo pipefail
          bash scripts/ci/install-tools.sh --prefix "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      # 仓库转公开后 runner 资源不再受限，而 4 个发行版镜像本来就公开可取。
      # 先拉下来，让 03_container 的容器用例真跑——此前它们在 CI 上恒 skip。
      - name: Pull release images
        run: |
          set -euo pipefail
          # 受支持 release 的单一事实源（#127）
          while read -r release; do
            [ -n "${release}" ] || continue
            docker pull "ghcr.io/zeek-zhao/yp-distro/${release}:latest"
          done < config/supported-releases.txt
      - name: Run BATS and render report
        run: bash scripts/report.sh all
      - name: Skip gate
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(reports/bats-*.xml)
          if ((${#files[@]} == 0)); then
            echo "::error::没有找到 BATS 的 JUnit 报告"
            exit 1
          fi
          xml="$(printf '%s\n' "${files[@]}" | sort | tail -n 1)"
          bash scripts/ci/skip-gate.sh "${xml}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          path: |
            reports/
            docs/qa/
          name: bats-report
          retention-days: 14

  # 上面那个 job 只跑一遍 BATS（report.sh all 的语义），真正吃 release 配置的
  # 用例（features.txt 的 release 维度、99_coverage 的降级清单比对）此前从未
  # 按四个发行版分别验证过。这里补矩阵，成本只是在同一批用例上多跑三次。

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - name: Scan tracked files
        run: |
          set -euo pipefail
          bash scripts/ci/secret-scan.sh

  # 2026-11-01 历史重写后加的门禁：身份必须统一，内部域名/内网地址不得回潮。
  # 需要全历史，故 fetch-depth: 0。
  identity-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: 校验提交身份与内部信息
        run: bash scripts/ci/identity-guard.sh

  # 问题清单的真源是 GitHub Issues；docs/issues.md 是生成物。这里校验它没漂移，
  # 避免「文档说要做什么」和「issue 里实际是什么」各说各话。
  plan-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - name: 校验 docs/issues.md 与线上一致
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/plan-sync.sh --check

  # 仓库转公开后 rulesets 已解锁，main 的保护改由平台级 ruleset 强制
  # （禁止直推 / 强制 PR / 强制状态检查 / 禁止 force push），见 docs/06-process/branching.md §4。
  # 这个 job 保留作备份：ruleset 被误删或临时放开时，它仍会判红。
  branch-guard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: 校验 main 上的提交来自 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          count="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" --jq 'length')"
          if [ "${count}" -eq 0 ]; then
            echo "::error::提交 ${SHA} 未经 PR 直接进入 main；流程见 docs/06-process/branching.md §4"
            exit 1
          fi
          echo "来自 ${count} 个 PR，通过"
