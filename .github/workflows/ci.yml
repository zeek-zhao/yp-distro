name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools and lint
        run: |
          set -euo pipefail
          bash scripts/ci/install-tools.sh --prefix "$RUNNER_TEMP/tools"
          export PATH="$RUNNER_TEMP/tools/bin:$PATH"
          bash scripts/ci/lint.sh
  bats:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools and report
        run: |
          set -euo pipefail
          bash scripts/ci/install-tools.sh --prefix "$RUNNER_TEMP/tools"
          export PATH="$RUNNER_TEMP/tools/bin:$PATH"
          bash scripts/report.sh all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          path: |
            reports/
            docs/qa/
          name: bats-report
          retention-days: 14
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        run: |
          set -euo pipefail
          bash scripts/ci/secret-scan.sh
