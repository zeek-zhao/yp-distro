# M0 publish workflow（方案 A / ADR-002）
# 用加密 secret GHCR_PAT（write:packages，CHG-010）发布镜像到 GHCR；
# token 不入库、只经 Actions secret 注入（iso-mapping 第 7 节 / ISS-016）。
name: M0 publish (dispatch + restricted push)

# CHG-007：dispatch API 在孤立分支不可用（ISS-005），但 push 事件可用（run 45594520683）。
# 受限 push 只负责触发；并入 main 后 workflow_dispatch 继续可用。
on:
  workflow_dispatch:
  push:
    branches:
      - feat-m0-kas-bootstrap
    paths:
      - 'docker/**'
      - 'scripts/cache/**'
      - 'kas/**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: zeek-zhao
  # CHG-011：S5 载荷样本（抽样自真实 S5 构建缓存）的 release 位置
  S5_PAYLOAD_TAG: m0-s5-payload-sample
  S5_PAYLOAD_ASSET: cache-payload-sample.tar.gz

jobs:
  # CHG-011 / ISS-016：为 publish-cache-slices 生产 cache-payload 制品；
  # 载荷是真实 S5 构建缓存的抽样，不是仓库内伪造目录。
  prepare-cache-payload:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch real S5 payload sample from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset_url="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${S5_PAYLOAD_TAG}" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(a["url"] for a in d["assets"] if a["name"] == "{{ env.S5_PAYLOAD_ASSET }}"))')"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
            "$asset_url" -o /tmp/cache-payload-sample.tar.gz
          mkdir -p /tmp/s5-payload
          tar -xzf /tmp/cache-payload-sample.tar.gz -C /tmp/s5-payload
          for d in downloads sstate; do
            if [ ! -d "/tmp/s5-payload/$d" ] || ! find "/tmp/s5-payload/$d" -type f -print -quit | grep -q .; then
              echo "::error::S5 载荷样本缺少非空 $d/ 目录，停止发布"
              exit 1
            fi
          done
          echo "S5_PAYLOAD_SAMPLE_OK files=$(find /tmp/s5-payload -type f | wc -l)"

      - name: Upload cache-payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cache-payload
          path: /tmp/s5-payload
          if-no-files-found: error

  publish-builder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push yp-builder
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          build-args: |
            JENKINS_UID=1000
            JENKINS_GID=1000
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/yp-builder:wrynose-m0

  publish-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push yp-cache baseline (layout only, DES-008 / F-02)
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/cache.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/yp-cache:wrynose-m0

  # S6/S7 接线（DES-008 / ADR-005 方案 1 / F-07 / CHG-007 / T3）：pack → gen-meta → split → 每片一个 tag → manifest + digest
  # 缓存源必须由 S5 产物提供；取不到则明确失败，不伪造推送。触发：受限 push（本分支）或并入 main 后的 dispatch。
  publish-cache-slices:
    needs: prepare-cache-payload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GHCR_PAT }}

      # CHG-008 / ISS-014：载荷只来自 S5 上传的具名制品，取不到即失败，不用仓库内路径冒充
      - name: Fetch S5 cache payload artifact
        id: payload
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cache-payload
          path: ${{ runner.temp }}/s5-payload

      - name: Verify S5 payload
        id: src
        env:
          PAYLOAD_DIR: ${{ runner.temp }}/s5-payload
          PAYLOAD_OUTCOME: ${{ steps.payload.outcome }}
        run: |
          set -euo pipefail
          if [ "$PAYLOAD_OUTCOME" != "success" ]; then
            echo "::error::S5 cache-payload 制品下载失败（outcome=$PAYLOAD_OUTCOME）；请先由 S5 上传名为 cache-payload 的制品（含 downloads/ 与 sstate/）"
            exit 1
          fi
          for d in downloads sstate; do
            if [ ! -d "$PAYLOAD_DIR/$d" ] || ! find "$PAYLOAD_DIR/$d" -type f -print -quit | grep -q .; then
              echo "::error::S5 cache-payload 缺少非空 $d/ 目录（$PAYLOAD_DIR/$d）；禁止用仓库内不存在的 ./cache-payload 冒充"
              exit 1
            fi
          done
          echo "downloads=$PAYLOAD_DIR/downloads" >> "$GITHUB_OUTPUT"
          echo "sstate=$PAYLOAD_DIR/sstate" >> "$GITHUB_OUTPUT"
          echo "CACHE_SOURCE_FOUND"

      - name: Pack cache payload
        run: bash scripts/cache/pack.sh --src "${{ steps.src.outputs.downloads }}" --src "${{ steps.src.outputs.sstate }}" --out /tmp/yp-cache.tar

      - name: Generate cache metadata from threshold.conf
        run: bash scripts/cache/gen-meta.sh > /tmp/cache-meta.json && cat /tmp/cache-meta.json

      - name: Split into slices (threshold.conf only)
        run: bash scripts/cache/split.sh --in /tmp/yp-cache.tar --out /tmp/slices

      - name: Publish each slice as a GHCR tag
        run: |
          set -euo pipefail
          total="$(python3 -c "import json; print(json.load(open('/tmp/slices/manifest.json'))['total_slices'])")"
          : > /tmp/slice-digests.txt
          idx=0
          while [ "$idx" -lt "$total" ]; do
            nn="$(printf '%02d' "$idx")"
            slice="/tmp/slices/cache.slice.$nn"
            tag="${REGISTRY}/${OWNER}/yp-cache:wrynose-m0-part-${nn}"
            # 每片作为单文件镜像层发布，供匿名 docker pull + docker cp 取回（ADR-005 方案 1）
            printf 'FROM alpine:3.20\nCOPY cache.slice.%s /work/slices/cache.slice.%s\n' "$nn" "$nn" > /tmp/slice.Dockerfile
            docker build -f /tmp/slice.Dockerfile -t "$tag" /tmp/slices
            # 失败即停：push / inspect / 空 digest 都不允许写成成功（ISS-014 / CHG-008）
            docker push "$tag"
            digest="$(docker buildx imagetools inspect "$tag" | grep -m1 'Digest:' | awk '{print $2}')"
            if [ -z "$digest" ]; then
              echo "::error::分片 $tag 的 imagetools inspect 未给出 Digest，拒绝记为发布成功"
              exit 1
            fi
            echo "$tag $digest" >> /tmp/slice-digests.txt
            idx=$((idx+1))
          done

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: yp-cache-slices-manifest
          path: /tmp/slices/manifest.json
          if-no-files-found: error

      - name: Summarize published slices
        run: |
          echo "### 分片发布摘要（ADR-005 方案 1 / CHG-008）" >> "$GITHUB_STEP_SUMMARY"
          echo "manifest artifact: yp-cache-slices-manifest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/slice-digests.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/slices/manifest.json >> "$GITHUB_STEP_SUMMARY"
