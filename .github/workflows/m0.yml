# M0 publish workflow（方案 A / ADR-002）
# 用 Actions 内置 GITHUB_TOKEN（packages: write）发布镜像到 GHCR，
# 不依赖用户 PAT，不入库任何密钥（iso-mapping 第 7 节）。
name: M0 publish (dispatch + restricted push)

# CHG-007：dispatch API 在孤立分支不可用（ISS-005），但 push 事件可用（run 45594520683）。
# 受限 push 只负责触发；并入 main 后 workflow_dispatch 继续可用。
on:
  workflow_dispatch:
  push:
    branches:
      - feat-m0-kas-bootstrap
    paths:
      - 'docker/**'
      - 'scripts/cache/**'
      - 'kas/**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: zeek-zhao

jobs:
  publish-builder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push yp-builder
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          build-args: |
            JENKINS_UID=1000
            JENKINS_GID=1000
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/yp-builder:wrynose-m0

  publish-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push yp-cache baseline (layout only, DES-008 / F-02)
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/cache.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/yp-cache:wrynose-m0

  # S6/S7 接线（DES-008 / ADR-005 方案 1 / F-07 / CHG-007 / T3）：pack → gen-meta → split → 每片一个 tag → manifest + digest
  # 缓存源必须由 S5 产物提供；取不到则明确失败，不伪造推送。触发：受限 push（本分支）或并入 main 后的 dispatch。
  publish-cache-slices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare cache source from S5 payload
        id: src
        run: |
          set -euo pipefail
          SRC_DOWNLOADS="${{ vars.YP_CACHE_DOWNLOADS_DIR || './cache-payload/downloads' }}"
          SRC_SSTATE="${{ vars.YP_CACHE_SSTATE_DIR || './cache-payload/sstate' }}"
          if [ -d "$SRC_DOWNLOADS" ] && [ -d "$SRC_SSTATE" ]; then
            echo "downloads=$SRC_DOWNLOADS" >> "$GITHUB_OUTPUT"
            echo "sstate=$SRC_SSTATE" >> "$GITHUB_OUTPUT"
            echo "CACHE_SOURCE_FOUND"
          else
            echo "::error::S5 缓存产物不存在（$SRC_DOWNLOADS / $SRC_SSTATE），跳过分片发布；需先由 S5 构建产物提供 downloads/sstate"
            exit 1
          fi

      - name: Pack cache payload
        run: bash scripts/cache/pack.sh --src "${{ steps.src.outputs.downloads }}" --src "${{ steps.src.outputs.sstate }}" --out /tmp/yp-cache.tar

      - name: Generate cache metadata from threshold.conf
        run: bash scripts/cache/gen-meta.sh > /tmp/cache-meta.json && cat /tmp/cache-meta.json

      - name: Split into slices (threshold.conf only)
        run: bash scripts/cache/split.sh --in /tmp/yp-cache.tar --out /tmp/slices

      - name: Publish each slice as a GHCR tag + upload manifest
        run: |
          set -euo pipefail
          total="$(python3 -c "import json; print(json.load(open('/tmp/slices/manifest.json'))['total_slices'])")"
          : > /tmp/slice-digests.txt
          idx=0
          while [ "$idx" -lt "$total" ]; do
            nn="$(printf '%02d' "$idx")"
            slice="/tmp/slices/cache.slice.$nn"
            tag="${REGISTRY}/${OWNER}/yp-cache:wrynose-m0-part-${nn}"
            # 每片作为单文件镜像层发布，供匿名 docker pull + docker cp 取回（ADR-005 方案 1）
            printf 'FROM alpine:3.20\nCOPY cache.slice.%s /work/slices/cache.slice.%s\n' "$nn" "$nn" > /tmp/slice.Dockerfile
            docker build -f /tmp/slice.Dockerfile -t "$tag" /tmp/slices
            digest="$(docker push "$tag" >/dev/null 2>&1 && docker buildx imagetools inspect "$tag" 2>/dev/null | grep -m1 'Digest:' | awk '{print $2}' || echo 'push-ok')"
            echo "$tag $digest" >> /tmp/slice-digests.txt
            idx=$((idx+1))
          done
          echo "### 分片发布摘要（ADR-005 方案 1）" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/slice-digests.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/slices/manifest.json >> "$GITHUB_STEP_SUMMARY"
