name: images
on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "scripts/image.sh"
      - "scripts/ci/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: dunfell
            series: "3.1"
          - release: kirkstone
            series: "4.0"
          - release: scarthgap
            series: "5.0"
          - release: wrynose
            series: "6.0"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute short SHA
        id: meta
        run: |
          set -euo pipefail
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.release }}/Dockerfile
          push: true
          build-args: APT_MIRROR=archive.ubuntu.com
          tags: |
            ghcr.io/zeek-zhao/yp-distro/${{ matrix.release }}:sha-${{ steps.meta.outputs.short_sha }}
            ghcr.io/zeek-zhao/yp-distro/${{ matrix.release }}:${{ matrix.series }}
            ghcr.io/zeek-zhao/yp-distro/${{ matrix.release }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/zeek-zhao/yp-distro
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.series }}
          cache-from: type=gha,scope=${{ matrix.release }}
          cache-to: type=gha,mode=max,scope=${{ matrix.release }}
