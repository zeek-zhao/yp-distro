# S8 PR 门禁（DES-009 / AGENTS §3）：方案 A 下用 workflow_dispatch + 分支 push 触发
# 不跑 bitbake（耗时；构建验证由独立 32c/128G 执行机承担）
# 与本地 bash scripts/gate.sh / check-vars.sh 共用同一实现，避免两处逻辑漂移。
name: M0 gate

on:
  workflow_dispatch:
  push:
    branches:
      - feat-m0-kas-bootstrap

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 提交身份检查需要完整历史

      - name: Set executable bits
        run: chmod +x scripts/gate.sh scripts/check-vars.sh scripts/cache/gen-meta.sh 2>/dev/null || true

      - name: S8 five checks (bash -n / threshold / no-cache-server / identity / doc consistency)
        run: bash scripts/gate.sh

      - name: S9 variable drift check (judgement 8)
        run: bash scripts/check-vars.sh
