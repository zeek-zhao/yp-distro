# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-yp"
BBFILE_PATTERN_meta-yp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-yp = "20"

LAYERDEPENDS_meta-yp = "core"
LAYERSERIES_COMPAT_meta-yp = "kirkstone scarthgap"
