require conf/distro/poky.conf

DISTRO = "yp"
DISTRO_NAME = "YP (Yocto Platform)"

require conf/distro/include/yp-common.inc
require conf/distro/include/yp-compat.inc

# ---- CVE 检查（只有 custom variant 打开：YP_CVE_ENABLE=1）----
# 必须进全局 INHERIT，不能只 inherit 在 yp-image 上：
#  1) cve-update-nvd2-native 的配方自带守卫，cve-check 类没全局加载就 SkipRecipe，
#     于是 yp-image 拿不到 CVE 库，报 “Nothing PROVIDES cve-update-nvd2-native”；
#  2) 逐 recipe 的 do_cve_check 本来也要求类在所有 recipe 上生效。
# 写在这里而不是 local.conf：kas 的 local_conf_header 段序是
# base -> custom -> machine -> release，release 段里 YP_CVE_CLASS 的赋值
# （wrynose = sbom-cve-check）还没发生，local.conf 里 `+=` 的立即展开会拿到默认值。
#
# wrynose 例外：6.0 把 sbom-cve-check.bbclass 放在 meta/classes-recipe/ 下，
# 全局 INHERIT 只在 classes/classes-global 里找，会报
# “Could not inherit file classes/sbom-cve-check.bbclass”。
# 所以 6.0 由各 release 关掉这一项（YP_CVE_GLOBAL_INHERIT=0），
# 它的 CVE 能力在 config/features.txt 里本来就标了 degraded（见 config/degraded.txt）。
INHERIT += "${@bb.utils.contains('YP_CVE_ENABLE', '1', d.getVar('YP_CVE_CLASS'), '', d) \
    if d.getVar('YP_CVE_GLOBAL_INHERIT') == '1' else ''}"

# ---- virtual/cpp-hello 的提供者 ----
# 只有 cpp-hello 提供这个虚拟名：cus-pack 刻意不提供，否则自己会被
# PREFERRED_PROVIDER 整份 SkipRecipe（两个提供者里只留被选中的一个）。
# 这里仍然钉死：将来万一又冒出第二个提供者，解析期就报错，而不是随机挑一个。
# 两种分隔符都写：3.1 只认 `_`，4.0+ 只认 `:`，未命中的那行是惰性变量。
PREFERRED_PROVIDER_virtual/cpp-hello = "cpp-hello"
PREFERRED_PROVIDER:virtual/cpp-hello = "cpp-hello"
