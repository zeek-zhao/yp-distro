# yp-minimal.cfg —— 6.0 内核裁剪 fragment（#72）
#
# 只在 wrynose 生效（bbappend 里按 LAYERSERIES 门控）。G1~G3 已按组串行实测，
# 结果与结论见 docs/qa/boot-baseline.md 第 6 节：G1（调试设施）是唯一有启动收益的
# 一组（kernel_ms -8.9%），G2/G3 是纯体积优化；压缩定稿 ZSTD（三者启动等价、体积最小）。
# 复测时沿用同一流程：一次只动一组，动完起机测三次。
#
# 保留清单（这些动了就起不来，别裁）：
#   CONFIG_VIRTIO_PCI / CONFIG_VIRTIO_NET / CONFIG_VIRTIO_BLK   —— QEMU 磁盘与网卡
#   CONFIG_EXT4_FS                                              —— rootfs 本体
#   CONFIG_SQUASHFS_FS / CONFIG_OVERLAY_FS                      —— #74 的 squashfs 实验要用
#   CONFIG_SERIAL_8250                                          —— 串口（打点链路依赖）
#   CONFIG_FB / CONFIG_DRM                                      —— console
#   CONFIG_BLK_DEV_INITRD / CONFIG_RD_GZIP                      —— initrd（runqemu 依赖）
#
# 实测基线（kernel 6.18.52 defconfig 里确实开着的）：DEBUG_INFO=y、FTRACE=y、
# KPROBES=y、BTRFS/NFS/CIFS=y、SOUND=m、WLAN=y、BT=y、ETHERNET=y；
# DYNAMIC_DEBUG / XFS / F2FS / NTFS3 / INPUT_JOYSTICK 本来就是关的，不用写。

# ---- G1 调试设施（影响镜像体积与解压；代价：无法内核调试）----
# 启用本组时必须同步摘 bbappend 里的 features/debug/debug-kernel.scc，
# 否则 KERNEL_FEATURES 在 fragment 之后合并，DEBUG_INFO 会被重新打开（实测踩过）。
# CONFIG_DEBUG_INFO is not set
# CONFIG_FTRACE is not set
# CONFIG_KPROBES is not set

# squashfs/overlayfs 是 #74 的实验前提，defconfig 里原本**根本没开**（不是 =m），
# 这里显式打开；代价：内核 +~300KB。
CONFIG_SQUASHFS=y
CONFIG_OVERLAY_FS=y

# ---- G2 不用的文件系统（代价：换硬件要重编；保留 ext4 + squashfs + overlayfs）----
# CONFIG_BTRFS_FS is not set
# CONFIG_NFS_FS is not set
# CONFIG_CIFS is not set

# ---- G3 不用的设备（代价：动态设备识别变弱；virtio 系在 drivers/net 之外不受影响）----
# CONFIG_SOUND is not set
# CONFIG_WLAN is not set
# CONFIG_BT is not set
# CONFIG_ETHERNET is not set

# ---- 压缩算法（#72 第 4 组实测：KVM 下三者启动时间等价，定稿 ZSTD，体积比 gzip 小 11%）----
# 宿主侧依赖 lz4-native / zstd-native 由 bbappend 提供（缺了报 `lz4: not found`）。
# CONFIG_KERNEL_GZIP is not set
# CONFIG_KERNEL_LZ4 is not set
CONFIG_KERNEL_ZSTD=y
