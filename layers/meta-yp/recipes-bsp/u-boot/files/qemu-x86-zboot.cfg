# wrynose 6.0 走 QEMU -bios u-boot.rom 加载 U-Boot，内核经 fw_cfg 交给 U-Boot 引导。
# 默认 standard boot 的 QFW bootmeth 硬编码 booti/bootz（ARM/RISC-V 专用），x86 没有
# 这两个命令，导致内核引导阶段报 Unknown command 'booti' / 'bootz'。x86 bzImage 必须
# 用 qfw load + zboot 引导（见 U-Boot 官方文档 doc/board/emulation/qemu-x86.rst）。
CONFIG_CMD_ZBOOT=y
CONFIG_CMD_QFW=y
# 覆盖默认 bootcmd：从 fw_cfg 载入内核/initrd（同时把内核大小写入 filesize 环境变量），
# 再用 zboot 单命令完成 start->load->setup->go 全流程引导 bzImage。
# ${kernel_addr_r}/${ramdisk_addr_r} 是 standard boot 默认环境变量（x86 通常 0x1000000/0x4000000）；
# 若目标 .config 里没有，自行补 CONFIG_KERNEL_ADDR_R/CONFIG_RAMDISK_ADDR_R 或把地址字面写死。
CONFIG_BOOTCOMMAND="qfw load ${kernel_addr_r} ${ramdisk_addr_r}; zboot ${kernel_addr_r} ${filesize} ${ramdisk_addr_r} 0"
