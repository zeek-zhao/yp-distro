# meta-yp-distro/conf/layer.conf
# S1 发行版层骨架：仅注册本层，兼容 wrynose 单一发布系列。
# 写法参考 main 分支 layers/meta-yp/conf/layer.conf 的结构，
# 但按 M0 约束 4 不复制 dunfell/kirkstone/scarthgap 多版本兼容。

# 让 bitbake 能找到本层的 conf/classes
BBPATH .= ":${LAYERDIR}"

# 预留配方扫描路径（S1 无配方，路径存在即可，后续 Step 填充）
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# 层集合注册
BBFILE_COLLECTIONS += "meta-yp-distro"
BBFILE_PATTERN_meta-yp-distro = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-yp-distro = "20"

# yp-wrynose.conf require 了 conf/distro/poky.conf，来自 meta-poky 层
LAYERDEPENDS_meta-yp-distro = "core meta-poky"

# M0 只面向 wrynose 单一发行版系列（见 YP-M0-ADR-001）
LAYERSERIES_COMPAT_meta-yp-distro = "wrynose"
