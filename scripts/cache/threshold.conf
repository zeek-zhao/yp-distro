# 缓存切分阈值（约束 8：唯一定义处，其他脚本必须 source 本文件）
# 单层 8 GiB = GHCR 单层上限 10 GB 的 80%
SLICE_MAX_BYTES=8589934592
# 上传 8 分钟 = 仓库上传超时 10 分钟的 80%
UPLOAD_TIMEOUT_SEC=480

# S4 挂载检查契约（CHG-002 / DES-004）
# 与 builder 镜像 jenkins 用户对齐（docker/Dockerfile 的 ARG 默认值）
JENKINS_UID=1000
JENKINS_GID=1000
# 挂载卷最小可用空间 10 GiB（preflight 只读检查，不足 exit 3）
MIN_FREE_BYTES=10737418240
