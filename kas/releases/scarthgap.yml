header:
  version: 14
  includes:
    - kas/base.yml

local_conf_header:
  release-name: |
    # custom variant 的主机名要带 release 名（§4.2）
    YP_RELEASE_NAME = "scarthgap"
  scarthgap: |
    # 5.0 起 file:// 解包到 ${UNPACKDIR}，且禁止 S = ${WORKDIR}
    YP_SRC_DIR = "${UNPACKDIR}"

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    tag: yocto-5.0.20
    layers:
      meta:
      meta-poky:
