header:
  version: 14
  includes:
    - kas/base.yml

local_conf_header:
  wrynose: |
    # 6.0 移除了 cve-check.bbclass，改为 SBOM 驱动的 sbom-cve-check
    YP_CVE_CLASS = "sbom-cve-check"
    # 5.0 起 file:// 解包到 ${UNPACKDIR}，且禁止 S = ${WORKDIR}
    YP_SRC_DIR = "${UNPACKDIR}"

repos:
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    tag: yocto-6.0.4
    layers:
      meta:
  bitbake:
    url: https://git.openembedded.org/bitbake
    tag: yocto-6.0.4
    layers: {}
  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    tag: yocto-6.0.4
    layers:
      meta-poky:
