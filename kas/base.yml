header:
  version: 14

distro: yp-wrynose
target: core-image-minimal

# repos 全部 commit pin（DES-002 §2.1 / ADR-004）；值为 git ls-remote ^{} 解引用后的真实 commit。
# 禁止裸 branch：meta-openembedded 用 branch+commit，commit 优先定版。
repos:
  meta-yp-distro:
    path: .
    layers:
      meta-yp-distro:
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    commit: 0f03c732a0a2d0506b41b1abe60b3f368b2300dc
    layers:
      meta:
  bitbake:
    url: https://git.openembedded.org/bitbake
    commit: 51fd94a67fa17650a9ff623492005972bbc7d26f
    # bitbake 是工具仓库，不是 layer：禁用仓库自身 layer，避免进入 BBLAYERS（ISS-008）
    layers:
      .: disabled
  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    commit: 7c25b11156553145fa6b241a2d4f65d94438f804
    layers:
      meta-poky:
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    commit: c0fcd7cca3760ef24e087ac4a31b8f357cb204da
    layers:
      meta-oe:

# 变量归口：可覆盖变量只在此定义默认值，edition 仅写差异（ADR-004）。
local_conf_header:
  base: |
    CONF_VERSION = "2"
    # 本地 hashserv，禁止远程缓存服务器（B-07）
    BB_HASHSERVE = "auto"
    # hashserv 数据库落到共享 sstate 卷，清 build 后仍可跨构建复用（ISS-010 / CHG-003）
    BB_HASHSERVE_DB_DIR = "${SSTATE_DIR}"
    # 长构建中 server 偶发通信超时，放宽等待窗口（ISS-010 / CHG-003）
    BB_SERVER_TIMEOUT = "300"
    # 构建并发资源化（M0.1.2 / CHG-022 / ISS-038）：按 bitbake 进程可见 CPU
    # 与容器 cgroup 内存双重分级——避免只按 CPU 翻倍导致 8GB 容器 OOM。
    # 分级函数 yp_mem_bytes(d)/yp_build_threads(d) 定义在 meta-yp-distro/classes/
    # yp-concurrency.bbclass（bitbake 的 local.conf 不支持多行 python def，ISS-040），
    # 由下面 INHERIT 引入；Docker --memory 不改写 /proc/meminfo，故优先读 cgroup v2/v1，
    # 值为 max/超范围时回退 /proc/meminfo MemTotal。
    # 用 oe.utils.cpu_count() 取 CPU：kas 5.5 隔离 bitbake server 进程环境，
    # 自定义环境变量无法传入 datastore（ISS-037），故不依赖任何 env 注入（ISS-039），
    # 实际并发值以容器内 bitbake-getvar 为准。
    INHERIT += "yp-concurrency"
    BB_NUMBER_THREADS = "${@yp_build_threads(d)}"
    PARALLEL_MAKE = "-j ${@max(1, int(d.getVar('BB_NUMBER_THREADS')) // 2)}"
    # 缓存目录指向 S4 挂载点（DES-002 §3.3）
    DL_DIR = "/work/downloads"
    SSTATE_DIR = "/work/sstate"
    PACKAGE_CLASSES ??= "package_rpm"
    DISTRO_FEATURES ??= ""
    INIT_MANAGER ??= "systemd"
