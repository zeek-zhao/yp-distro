header:
  version: 14

machine: qemux86-64
distro: poky
target: core-image-minimal

local_conf_header:
  base: |
    # dunfell(3.1) 的 local.conf.sample 是 1，kirkstone+ 是 2；
    # 各 release 层按需覆盖。
    CONF_VERSION ??= "2"
    PACKAGE_CLASSES = "package_rpm"
    INHERIT += "rm_work"
    # ../.. 刻意指向共享 work/；只用 .. 会退化成每版本一份缓存（#23）。
    DL_DIR = "${TOPDIR}/../../downloads"
    SSTATE_DIR = "${TOPDIR}/../../sstate"
    # CVE 检查的 class 名各版本不同：wrynose 用 sbom-cve-check 取代了 cve-check。
    # 只有 custom variant 会真正把它加进 IMAGE_CLASSES。
    YP_CVE_CLASS ??= "cve-check"
    # 只有能从全局 INHERIT 找到类的版本才在 yp.conf 里打开（6.0 例外）。
    YP_CVE_GLOBAL_INHERIT ??= "1"
    # CVE 库离线化（issue #48）：cve-update-nvd2-native 默认走 NVD 2.0 REST API，
    # 无 API key 时限流 5 次/30 秒、2000 条一页，首次建库约 25 万条 → 实测 4 小时。
    # -1 = 永不更新，库必须由 scripts/cve-db.sh 从 olbat/nvdcve 离线构建后放进
    # ${DL_DIR}/CVE_CHECK/。库缺失时构建会直接失败，而不是静默挂 4 小时。
    # 想去掉这一层回到官方 API：删掉这行，并把 4 小时算进计划。
    CVE_DB_UPDATE_INTERVAL = "-1"
    # custom variant 的调试特性。debug-tweaks 在 6.0 被拆掉（IMAGE_FEATURES[validitems]
    # 里已经没有它），所以由各 release 覆盖这个值，custom.yml 只做一层引用。
    YP_IMAGE_FEATURES ??= "debug-tweaks ssh-server-dropbear"
    # file:// 的解包目录各版本不同：3.1/4.0/5.0 在 ${WORKDIR}，6.0 起在 ${UNPACKDIR}。
    # 这里只定义我们自己的别名，绝不能去 ??= 上游的 UNPACKDIR（会污染默认值）。
    YP_SRC_DIR ??= "${WORKDIR}"

    # ---- 构建资源与安全阀（P2 基础设施，说明见 docs/build-env.md）----
    # 并行度 = min(可用核数, 20)。
    # 坑：bitbake.conf 里 BB_NUMBER_THREADS / PARALLEL_MAKE 本身就是 `?=`，而它
    # 比 local.conf 先解析，所以在 local.conf 里再写 `?=` 是空操作 —— 必须用 `=`。
    # 两者都在 BB_BASEHASH_IGNORE_VARS 里，改并行度不会触发重编译（实测 4551
    # 个任务仍 4548 个不用重跑）。构建机实测 32 核 / 124GB，跑满会和其他任务抢内存。
    BB_NUMBER_THREADS = "${@min(oe.utils.cpu_count(), 20)}"
    PARALLEL_MAKE = "-j ${@min(oe.utils.cpu_count(), 20)}"

    # 磁盘/inode 守护：先 STOPTASKS 停派新任务，继续恶化就 ABORT 中止整个构建。
    # 注意第二档必须是 ABORT 不能是 HALT：bitbake 3.1（dunfell）的
    # DiskSpaceMonitor 只认 ABORT/STOPTASKS/WARN，写 HALT 会直接
    # "ERROR: Unknown disk space monitor action: HALT" 把解析阶段打挂。
    # 四版共用一个值就只能选 ABORT（4.0+ 也仍然支持）。
    # 阈值刻意很低，这是「别把共享盘写满」的最后一道闸；日常水位看
    # scripts/lib/disk-guard.sh 的 85% 门禁（那个才是主动拦截）。
    BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},1G,100K STOPTASKS,${DL_DIR},1G,100K STOPTASKS,${SSTATE_DIR},1G,100K STOPTASKS,/tmp,100M,100K ABORT,${TMPDIR},100M,1K ABORT,${DL_DIR},100M,1K ABORT,${SSTATE_DIR},100M,1K ABORT,/tmp,10M,1K"

    # buildhistory：记录每个 recipe 的包内容/依赖与镜像文件清单，构建结束自动
    # git commit（含 metadata-revs，可回溯到当时的 layer 版本）。
    # 布局 work/buildhistory/<release>-<variant>/：各组合独立仓库，互不干扰，
    # 但同在一个父目录下，方便 buildhistory-diff 做跨版本对比。
    # 注意：只在任务真执行时才记录，命中 sstate 的 recipe 不会补录历史。
    INHERIT += "buildhistory"
    YP_VARIANT ??= "general"
    BUILDHISTORY_DIR = "${TOPDIR}/../../buildhistory/${YP_RELEASE_NAME}-${YP_VARIANT}"
    BUILDHISTORY_COMMIT = "1"
    BUILDHISTORY_COMMIT_AUTHOR = "yocto-build <yocto-build@yocto-platform.invalid>"

    # 为 git 源额外生成 git2_*.tar.gz 放进 DL_DIR，断网/镜像场景可整包搬运。
    # 只影响之后新 fetch 的条目；已命中 sstate 的 recipe 不会因此重跑 do_fetch。
    BB_GENERATE_MIRROR_TARBALLS = "1"
