header:
  version: 14

# M1-S1 / DES-002: dev 镜像目标（kas 5.5 顶层单数 target，覆盖 base 的 core-image-minimal）。
# prod 镜像仍由命令行 --target yp-image-prod 指定，不改 prod.yml。
target: yp-image-dev

# 开发：可调试、保留符号、不裁体积
local_conf_header:
  dev: |
    DISTRO_FEATURES:append = " debug-tweaks"
    INHERIT:remove = " rm_work"
    DEBUG_FLAGS = "-g"
    # M1-S3 / DES-004: deploy-target 走 scp/ssh，需目标 sshd 允许空密码 root 登录。
    # debug-tweaks 是 DISTRO_FEATURES，显式放开三项 IMAGE_FEATURES 以确保
    # root/shadow 不 zap + sshd PermitRootLogin/PermitEmptyPasswords=yes。
    EXTRA_IMAGE_FEATURES:append = " allow-empty-password empty-root-password allow-root-login"
    # M1-S1 / DES-002: dev 缓存按 edition 隔离（plan §3.3），不污染 prod 的 /work/sstate。
    # base.yml 的 SSTATE_DIR="/work/sstate" 保持只读断言，仅此处 edition 覆盖。
    SSTATE_DIR = "/work/sstate/dev"
    # M1-S4 / DES-005 / D-06: buildhistory 仅 dev edition 启用，产物按 TOPDIR 隔离，
    # 每次构建自动提交，供 buildhistory-diff 做两次构建差异归档（不污染 prod/base）。
    INHERIT += " buildhistory"
    BUILDHISTORY_DIR = "${TOPDIR}/buildhistory"
    BUILDHISTORY_COMMIT = "1"
    BUILDHISTORY_FEATURES = "image package"
